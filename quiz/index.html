var hg=document.getElementById('hg'),raum=document.getElementById('raum'),fort=document.getElementById('fort');
var schichten={};
BILD.forEach(function(k){var d=document.createElement('div');d.className='k-'+k;d.style.backgroundImage='url('+src(k)+')';hg.appendChild(d);schichten[k]=d;});
function bild(k){Object.keys(schichten).forEach(function(n){var d=schichten[n];if(n===k){d.classList.remove('an');void d.offsetWidth;d.classList.add('an');}else d.classList.remove('an');});}
var stand={};
function zeige(k,schritt,html){bild(k);fort.style.width=(schritt/5*100)+'%';delete raum.dataset.weg;raum.innerHTML=html;window.scrollTo({top:0,behavior:'smooth'});return raum;}
function waehlen(el,fn){[].forEach.call(el.querySelectorAll('[data-w]'),function(b){b.addEventListener('click',function(){
  if(el.dataset.weg)return;el.dataset.weg=1;b.classList.add('ja');if(navigator.vibrate)try{navigator.vibrate(12);}catch(e){}
  setTimeout(function(){fn(b.getAttribute('data-w'));},380);});});}
function frage(nr,titel,opts,eins){
  var h='<div class="glaskarte"><p class="eyebrow">'+nr+'</p><h2>'+titel+'</h2><div class="optionen'+(eins?' eins':'')+'">';
  opts.forEach(function(o){h+='<button type="button" class="opt" data-w="'+o.w+'"><span class="w">'+o.a+'</span>'+(o.b?'<span class="s">'+o.b+'</span>':'')+'</button>';});
  return h+'</div></div>';
}

function start(){
  var el=zeige('start',0,
    '<div class="glaskarte"><p class="eyebrow">Das Gold-Quiz</p>'+
    '<h1>Was wäre, wenn du früher <em>Gold</em> gekauft hättest?</h1>'+
    '<p class="text">Drei Fragen, eine Minute. Dann siehst du mit echten Kursen, was aus deinem Geld geworden wäre.</p>'+
    '<button class="cta" id="los" type="button">Finde es heraus</button>'+
    '<p class="fakten"><span>Echte Kurse seit 1979</span><span>·</span><span>Ohne Anmeldung</span></p></div>');
  el.querySelector('#los').addEventListener('click',fZiel);
}
function fZiel(){
  var el=zeige('betrag',1,frage('Frage 1 von 3','Wie viel Geld hättest du <em>heute</em> gerne?',ZIELE.map(function(x){return {w:x.z,a:eur.format(x.z),b:x.t};})));
  waehlen(el,function(w){stand.ziel=+w;fJahr();});
}
function fJahr(){
  var el=zeige('jahr',2,frage('Frage 2 von 3','Wann hättest du <em>anfangen</em> können?',JAHRE.map(function(x){return {w:x.j,a:x.j,b:x.t};})));
  waehlen(el,function(w){stand.start=+w;fArt();});
}
function fArt(){
  var el=zeige('art',3,frage('Frage 3 von 3','Wie hättest du <em>gespart</em>?',[
    {w:'einmal',a:'Einmal einen Betrag',b:'z. B. Erbe, Prämie, Erspartes'},
    {w:'monat',a:'Jeden Monat ein bisschen',b:'wie ein Sparplan'},
    {w:'beides',a:'Beides kombiniert',b:'ein Startbetrag plus monatlich'}],true));
  waehlen(el,function(w){stand.art=w;stand.r=rechnen(stand.ziel,stand.start,w);fTipp();});
}
function fTipp(){
  var r=stand.r,a=r.art;
  var t=a==='einmal'?'Was schätzt du: Wie viel hättest du '+r.start+' in <em>Gold</em> anlegen müssen?'
       :a==='monat'?'Was schätzt du: Wie viel hättest du ab '+r.start+' monatlich in <em>Gold</em> sparen müssen?'
       :'Was schätzt du: Mit welchem Startbetrag plus Monatsrate in <em>Gold</em> hättest du es ab '+r.start+' geschafft?';
  var opts=[{w:'spar',a:betrag(r.spar)},{w:'mitte',a:betrag(mittel(r.gold,r.spar))},{w:'gold',a:betrag(r.gold)}];
  var el=zeige('tipp',4,frage('Dein Tipp · Ziel '+eur.format(r.ziel),t,opts,true));
  waehlen(el,function(k){stand.tipp=k;ergebnis();});
}

function kurve(start){
  var y0=start-1,pts=[];for(var y=y0;y<=LETZT;y++)if(G[y]!=null)pts.push([y,G[y]]);pts.push([JETZT,GOLD_HEUTE]);
  var W=300,H=90,max=Math.max.apply(null,pts.map(function(p){return p[1];}))*1.08;
  var x=function(t){return 6+(t-y0)/(JETZT-y0)*(W-12);},yy=function(v){return H-16-(v/max)*(H-24);};
  var d=pts.map(function(p,i){return (i?'L':'M')+x(p[0]).toFixed(1)+' '+yy(p[1]).toFixed(1);}).join(' ');
  var l=pts[pts.length-1];
  return '<svg class="kurve" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Goldpreis in Euro seit '+start+'"><defs><linearGradient id="kf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3DFA6" stop-opacity=".35"/><stop offset="1" stop-color="#F3DFA6" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+d+' L'+x(JETZT).toFixed(1)+' '+(H-16)+' L'+x(y0).toFixed(1)+' '+(H-16)+' Z" fill="url(#kf)"/>'+
    '<path d="'+d+'" fill="none" stroke="#F3DFA6" stroke-width="2" stroke-linejoin="round"/>'+
    '<circle cx="'+x(l[0]).toFixed(1)+'" cy="'+yy(l[1]).toFixed(1)+'" r="4" fill="#FFF1C8"/>'+
    '<text x="6" y="'+(H-2)+'">'+start+' · '+eur.format(G[y0])+' je Unze</text><text x="'+(W-6)+'" y="'+(H-2)+'" text-anchor="end">heute · '+eur.format(GOLD_HEUTE)+'</text></svg>';
}
function zaehlen(el,ziel){var t0=null;if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=eur.format(ziel);return;}
  (function s(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/1500),e=1-Math.pow(1-p,4);el.textContent=eur.format(Math.round(ziel*e));if(p<1)requestAnimationFrame(s);})(performance.now());}
function reihe(img,name,v,k,r){
  return '<div class="reihe"><img alt="" src="'+src(img)+'"><span class="n">'+name+'</span><span class="v">'+betrag(v)+'</span>'+
    '<div class="spur"><div class="b '+k+'" data-b="'+Math.max(3,einsatz(v,r.monate)/r.ziel*100).toFixed(1)+'%"></div></div></div>';
}
function kaufkraftKarte(r){
  var k=r.kk,ref=k.kaufkraft,ein=betrag(r.gold);
  function zeile(name,wert,art){
    var diff=Math.round((wert/ref-1)*100),plus=diff>=0;
    var GRENZE=70,breite=Math.min(100,wert/ref*GRENZE),voll=wert>=ref;
    return '<div class="kk-zeile '+art+'"><div class="kk-kopf"><span class="kk-name">'+name+'</span>'+
      '<span class="kk-chip '+(plus?'plus':'minus')+'">'+(plus?'+':'−')+Math.abs(diff).toLocaleString('de-DE')+' % Kaufkraft</span></div>'+
      '<div class="kk-wert">'+eur.format(rund(wert,'einmal'))+'</div>'+
      '<div class="kk-spur"><div class="kk-b" data-b="'+breite.toFixed(1)+'%"></div>'+(voll?'':'<div class="kk-loch" style="left:'+breite.toFixed(1)+'%;width:'+(GRENZE-breite).toFixed(1)+'%"></div>')+'<i class="kk-marke" style="left:'+GRENZE+'%"></i></div></div>';
  }
  return '<div class="glaskarte kk" style="animation-delay:.25s"><p class="eyebrow">Was wirklich übrig bleibt</p>'+
    '<h2>Gleicher Einsatz, <em>drei</em> Ergebnisse</h2>'+
    '<p class="text">Du legst '+ein+' zurück. Damit das heute noch genauso viel wert ist wie damals, bräuchtest du wegen der Inflation <b>'+eur.format(rund(ref,'einmal'))+'</b>. Die Linie zeigt diese Grenze.</p>'+
    zeile('Bargeld zu Hause',k.bar,'k')+zeile('Sparbuch mit Zinsen',k.spar,'s')+zeile('Gold',k.gold,'g')+
    '<p class="klein">Kaufkraft = was du dir heute davon kaufen kannst, verglichen mit dem, was das Geld beim Einzahlen wert war. Inflation: Verbraucherpreise Deutschland.</p></div>';
}
function ergebnis(){
  var r=stand.r,a=r.art,n=r.monate,mal=(einsatz(r.spar,n)/einsatz(r.gold,n)).toLocaleString('de-DE',{maximumFractionDigits:1});
  var hauptwert=a==='monat'?rund(r.gold.m,'monat'):rund(r.gold.e,'einmal');
  var nach=a==='einmal'?'anlegen müssen':a==='monat'?'im Monat sparen müssen':'zum Start und <b>'+geld(r.gold.m,'monat').replace(' / Monat','')+' im Monat</b> sparen müssen';
  var reakt={gold:'Treffer! Die meisten schätzen viel höher.',mitte:'Knapp daneben. Es war noch weniger.',spar:'So viel hätte das Sparbuch gebraucht.'}[stand.tipp];
  var text='Hallo Thomas, ich habe das Gold-Quiz gemacht: Für '+eur.format(r.ziel)+' heute hätte ich ab '+r.start+' nur '+betrag(r.gold)+' in Gold gebraucht. Wie fange ich heute sinnvoll an?';
  var el=zeige('ergebnis',5,
    '<div class="glaskarte"><p class="eyebrow">'+reakt+'</p>'+
    '<p class="vorzahl">Mit Gold hättest du '+(a==='einmal'?r.start+' nur':'ab '+r.start+' nur')+'</p>'+
    '<p class="zahl" id="zahl">0 €</p>'+
    '<p class="nachzahl">'+nach+', um heute <b>'+eur.format(r.ziel)+'</b> zu haben.</p>'+
    '<span class="pille">'+mal+'-mal weniger Einsatz als mit dem Sparbuch</span>'+
    '<div class="vergleich">'+reihe('t_gold','Gold',r.gold,'g',r)+reihe('t_spar','Sparbuch mit Zinsen',r.spar,'s',r)+reihe('t_kissen','Bargeld zu Hause',r.kissen,'k',r)+'</div>'+
    kurve(r.start)+
    '</div>'+
    kaufkraftKarte(r)+
    '<div class="glaskarte" style="animation-delay:.5s"><h2>Und ab <em>heute</em>?</h2>'+
    '<p class="text">Die Vergangenheit holt niemand nach. In einem kurzen Gespräch zeige ich dir, wie du heute mit Gold und Silber eine Reserve aufbaust, auch mit kleinen Monatsbeträgen.</p>'+
    '<div class="person"><img alt="Thomas Fiebig" src="'+src('portrait')+'"><div><b>Thomas Fiebig</b><span>Edelmetallfachberater</span></div></div>'+
    '<a class="cta" href="https://wa.me/4916096432246?text='+encodeURIComponent(text)+'" target="_blank" rel="noopener">Schick mir dein Ergebnis</a>'+
    '<a class="leise" href="https://zeeg.me/fiebig-edelmetallfachberater" target="_blank" rel="noopener">Direkt Termin buchen</a>'+
    '<p class="ratgeber">Erst in Ruhe lesen? <a href="https://broschuere.fiebig-edelmetallfachberater.com" target="_blank" rel="noopener">Gratis-Ratgeber</a></p>'+
    '<hr class="trenn"><button class="nochmal" type="button" id="nochmal">Mit anderem Jahr nochmal spielen</button>'+
    '<p class="recht">Rückblick mit echten Daten, keine Prognose. Vergangene Wertentwicklung ist kein verlässlicher Hinweis auf künftige Ergebnisse, Edelmetallpreise schwanken auch nach unten. Gold: Jahresschlusskurse in Euro je Feinunze (gold.de), heute '+eur.format(GOLD_HEUTE)+' am '+STAND.toLocaleDateString('de-DE')+'. Sparbuch: Durchschnittszinsen Deutsche Bundesbank. Inflation: Statistisches Bundesamt, für Jahre ab 2026 Eurostat (HVPI). Ohne Kosten und Steuern.</p></div>');
  zaehlen(el.querySelector('#zahl'),hauptwert);
  setTimeout(function(){[].forEach.call(el.querySelectorAll('.b,.kk-b'),function(b){b.style.width=b.getAttribute('data-b');});},500);
  el.querySelector('#nochmal').addEventListener('click',function(){stand={ziel:stand.ziel};fJahr();});
}
start();
})();
</script>
</body>
</html>
